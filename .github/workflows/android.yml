name: Android

# Builds a debug APK you can sideload onto a phone.
#
# It runs here rather than on the dev box for two reasons: the ubuntu runner ships
# with the JDK and Android SDK already installed, and Gradle plus the Kotlin
# compiler want more memory than that machine has spare while it is also running
# ArcadeDB and imports.
#
# Debug signing only, on purpose. A debug APK installs fine by sideloading, which
# is all a personal build needs. A release build would need a keystore in secrets,
# and that is worth setting up when there is something to publish — not before.
#
# Manual by default: this does not need to run on every push, and an APK nobody
# downloads is just minutes spent. It also runs on a tag so a release is
# reproducible when there is one.

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Site the app loads (see capacitor.config.ts)'
        required: false
        default: 'https://dev.owlgraph.org'
  push:
    tags: ['v*']

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # The version comes from the tag, like every other build (scripts/app-version.mjs).
      # A tag build must carry a release version; a manual run is a development
      # build (0.0.0-dev+<commit>, versionCode 1) and says so in the app.
      - name: Version from the tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v=$(APP_VERSION="${{ github.ref_name }}" node scripts/app-version.mjs --check)
          else
            v=$(GIT_COMMIT="${{ github.sha }}" node scripts/app-version.mjs)
          fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$(APP_VERSION="$v" node scripts/app-version.mjs --code)" >> "$GITHUB_ENV"
          echo "GIT_COMMIT=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "version $v"

      # The app loads the deployed site, so these assets are not what runs — but
      # `cap sync` requires webDir to exist, and building it also proves the web
      # app still compiles before we wrap it.
      - name: Build the web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android
        env:
          CAP_SERVER_URL: ${{ inputs.server_url || 'https://dev.owlgraph.org' }}

      # Confirm the APK will point where we think. Getting this wrong produces an
      # app that looks fine and silently talks to the wrong environment.
      - name: Show what the app will load
        run: |
          echo "--- android/app/src/main/assets/capacitor.config.json ---"
          cat android/app/src/main/assets/capacitor.config.json

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK carries its version
        run: |
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -E "versionCode|versionName" | head -1
          "$aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk \
            | grep -q "versionCode='$APP_VERSION_CODE' versionName='$APP_VERSION'"

      - uses: actions/upload-artifact@v4
        with:
          name: owlgraph-debug-apk-${{ env.APP_VERSION }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
