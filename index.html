<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Owlgraph – Corporate Ownership Map</title>

    <!-- The SVG first: browsers that take it get a mark that stays sharp at any
         size and follows the tab's own scaling. The .ico is the fallback for the
         ones that don't, and lives at the root because that is where a browser
         looks for it unasked. -->
    <link rel="icon" href="/icons/logo.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icons/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/icons/logo-180.png" />
    <!-- .json rather than .webmanifest: static hosts map the former to a JSON
         content type and serve the latter as octet-stream, which is not what a
         manifest is supposed to arrive as. -->
    <link rel="manifest" href="/manifest.json" />
    <!-- Two media-qualified tags: the WebAPK's status bar ignores runtime
         meta updates on some Androids and evaluates these natively against
         the SYSTEM scheme — the only declarative path to a dark bar there.
         The inline script + useTheme still rewrite both for the in-app
         toggle, for browsers that honour dynamic changes. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f0f4f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a2e" />
    <script>
      // The browser/PWA samples theme-color at LOAD — before React applies the
      // saved theme — so a dark-mode user got a white bar until (and on some
      // platforms regardless of) the late runtime update. Decide synchronously
      // from the same key useTheme persists, before first paint.
      (function () {
        try {
          var mode = localStorage.getItem('owlgraph-theme')
          var light = mode === 'light' || (mode !== 'dark' &&
            window.matchMedia('(prefers-color-scheme: light)').matches)
          var colour = light ? '#f0f4f8' : '#1a1a2e'
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.setAttribute('content', colour)
          })
          if (!light) document.documentElement.setAttribute('data-theme', 'dark')
        } catch (e) { /* default stays light */ }
      })()
    </script>
    <script>
      (function(){
        var t = localStorage.getItem('owlgraph-theme');
        if (!t) { try { t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; } catch(e) { t = 'dark'; } }
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
